<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スワイプタスク</title>
    <link rel="stylesheet" href="Swipe.css">
</head>

<body>

    <div class="container">
        <div class="center-area">
            <div class="black-box">
                <div class="gesture-area" id="track">
                    <svg class="curve-svg" viewBox="0 0 240 120" preserveAspectRatio="none">
                        <path d="M 30 95 Q 120 -45 210 95" class="curve-path"></path>
                    </svg>

                    <div class="swipe-handle" id="handle">
                        <svg id="arrowIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white"
                            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-area">
            <p class="instruction-text">スワイプしてください</p>
        </div>
    </div>

    <script src="Swipe.js"></script>
</body>

</html>
