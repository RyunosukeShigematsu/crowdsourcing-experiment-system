<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タッチ確認</title>
    <link rel="stylesheet" href="Touch.css">
</head>

<body>

    <div class="container">
        <div class="center-area">
            <div class="black-box">
                <svg width="100%" height="100%" viewBox="0 0 300 140" class="letters-svg">
                    <text x="62" y="74" class="letter">C</text>
                    <text x="144" y="96" class="letter">A</text>
                    <text x="236" y="81" id="targetLetter" class="letter clickable-letter">B</text>
                </svg>
            </div>
        </div>

        <div class="bottom-area">
            <p class="instruction-text">Bをタッチしてください</p>
        </div>
    </div>

    <script src="Touch.js"></script>
</body>

</html>
